version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      MYSQL_USER: api_user
      MYSQL_PASSWORD: api_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_ui
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - db

  api:
    build: .
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./images:/images # Mapeia a pasta local para não perder as fotos
    environment:
      # String de conexão: driver://user:pass@host:port/dbname
      - DATABASE_URL=mysql+pymysql://api_user:api_password@db:3306/app_db
    depends_on:
      - db
    # Inicia o servidor com hot-reload para facilitar o desenvolvimento
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data: # Volume nomeado para garantir que os dados do MySQL não sejam apagados